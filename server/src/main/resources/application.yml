server:
  port: ${PORT:8080}

spring:
  application:
    name: siranaba-backend
  # Load server/.env (key=value format) without any extra library.
  # Resolved relative to the working directory, which must be server/.
  config:
    import: optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/siranaba}
      database: ${MONGODB_DATABASE:siranaba}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-your-env-file}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    cookie-name: siranaba_token
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    # If no key is set, ticket triage falls back to simple keyword-based rules
    # instead of calling Gemini, so the app still works without the key.
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    demo-email: ${DEMO_EMAIL:alex.rivers@siranaba.com}
    demo-password: ${DEMO_PASSWORD:Password123!}
    admin-email: ${ADMIN_EMAIL:admin@siranaba.com}
    admin-password: ${ADMIN_PASSWORD:${DEMO_PASSWORD:Password123!}}

logging:
  level:
    com.siranaba.backend: INFO
