server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB
  application:
    name: siranaba-backend
  # Load server/.env (key=value format) without any extra library.
  # Resolved relative to the working directory, which must be server/.
  config:
    import: optional:file:.env[.properties]
  # Outgoing mail (SMTP). The mail sender is only created when MAIL_HOST is set;
  # without it, tenant registration still works but no email is sent.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:true}
      mail.smtp.connectiontimeout: ${MAIL_CONNECTION_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_READ_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_WRITE_TIMEOUT_MS:5000}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/siranaba}
      database: ${MONGODB_DATABASE:siranaba}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3

app:
  rabbitmq:
    # Opt in after starting RabbitMQ. When disabled, the existing local worker is used.
    enabled: ${RABBITMQ_ENABLED:false}
  # Public front-end base URL used to build links in outgoing emails.
  portal-url: ${PORTAL_URL:https://siranaba.up.railway.app}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@siranaba.com}}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-string-in-your-env-file}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
    cookie-name: siranaba_token
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    # If no key is set, ticket triage falls back to simple keyword-based rules
    # instead of calling Gemini, so the app still works without the key.
  seed:
    enabled: ${SEED_DEMO_DATA:true}
    demo-email: ${DEMO_EMAIL:alex.rivers@siranaba.com}
    demo-password: ${DEMO_PASSWORD:Password123!}
    admin-email: ${ADMIN_EMAIL:admin@siranaba.com}
    admin-password: ${ADMIN_PASSWORD:${DEMO_PASSWORD:Password123!}}

logging:
  level:
    com.siranaba.backend: INFO
